<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #071428;
      }
      #main {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Shots 34-37 of "Medicare Part D Changes for 2027" (source 4:08.6 -> 4:38.2, plus a 1.2 s hold).
      This layer is the 1920x1080 graphics + full audio mix. Arric (green-screen, left third)
      is keyed and laid over this layer by build.sh, so the left 700 px is deliberately clear.
      Scene clocks run on the global clock (every host starts at 0).
    -->
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="30.84"
      data-width="1920"
      data-height="1080"
      data-fps="25"
    >
      <div
        id="bg"
        class="clip"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="30.84"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="checklist"
        class="clip"
        data-composition-id="checklist"
        data-composition-src="compositions/checklist.html"
        data-start="0"
        data-duration="20.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="contact"
        class="clip"
        data-composition-id="contact"
        data-composition-src="compositions/contact.html"
        data-start="0"
        data-duration="30.84"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="tabs"
        class="clip"
        data-composition-id="tabs"
        data-composition-src="compositions/tabs.html"
        data-start="0"
        data-duration="30.84"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>

      <!-- Narration (source audio, trimmed 4:08.6 -> end, loudness-normalised to -16 LUFS, +1.2 s tail) -->
      <audio id="voice" src="assets/audio/voice.wav" data-start="0" data-duration="30.84" data-track-index="10" data-volume="1"></audio>

      <!-- Music bed: swells in under Shot 37 -->
      <audio id="music" src="assets/audio/music.mp3" data-start="20.1" data-duration="10.74" data-track-index="11" data-volume="0.14" data-fade-out="0.9"></audio>

      <!-- Shot 34: paper unfold as the checklist card opens; ding as Step 1 checks -->
      <audio id="sfx-paper" src="assets/audio/paper_unfold.mp3" data-start="0.3" data-duration="1.48" data-track-index="12" data-volume="2"></audio>
      <audio id="sfx-ding1" src="assets/audio/ding_a.mp3" data-start="2.96" data-duration="0.8" data-track-index="13" data-volume="0.32"></audio>

      <!-- Shot 35: ding-ding as Step 2 and Step 3 check -->
      <audio id="sfx-ding2" src="assets/audio/ding_b.mp3" data-start="9.98" data-duration="0.8" data-track-index="14" data-volume="0.32"></audio>
      <audio id="sfx-ding3" src="assets/audio/ding_a.mp3" data-start="12.98" data-duration="0.8" data-track-index="15" data-volume="0.32"></audio>

      <!-- Shot 36: warm bell ping as the Pro-Tip banner lands, marker swipe across "Dec 7 Midnight" -->
      <audio id="sfx-bell" src="assets/audio/bell_ping.mp3" data-start="13.4" data-duration="1.48" data-track-index="16" data-volume="2.2"></audio>
      <audio id="sfx-marker" src="assets/audio/marker_swipe.mp3" data-start="15.8" data-duration="1.2" data-track-index="17" data-volume="0.4"></audio>

      <!-- Shot 37: dial ticks on each phone-number group, click on the website, resolving chord -->
      <audio id="sfx-tick1" src="assets/audio/tick_a.mp3" data-start="23.5" data-duration="0.48" data-track-index="18" data-volume="1.1"></audio>
      <audio id="sfx-tick2" src="assets/audio/tick_b.mp3" data-start="24.34" data-duration="0.48" data-track-index="19" data-volume="1.4"></audio>
      <audio id="sfx-tick3" src="assets/audio/tick_a.mp3" data-start="24.9" data-duration="0.48" data-track-index="20" data-volume="1.1"></audio>
      <audio id="sfx-click" src="assets/audio/mouse_click.mp3" data-start="29.02" data-duration="0.48" data-track-index="21" data-volume="0.22"></audio>
      <audio id="sfx-chord" src="assets/audio/chord.mp3" data-start="29.4" data-duration="1.44" data-track-index="22" data-volume="0.4" data-fade-out="0.5"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
